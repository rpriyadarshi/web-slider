slides:
  - id: title
    layout: title
    title: Launch Review
    subtitle: Decide what ships on Friday
    notes: Open with the decision, not the status report.
    side:
      - type: callout
        text: Twenty minutes. Three questions. One owner.
  - id: agenda
    layout: section
    title: Three decisions
    subtitle: Scope, date, and the condition to proceed
    notes: Read the three questions, then go straight to scope.
  - id: scope
    layout: content
    title: Scope is the constraint
    notes: Do not relitigate last quarter. Ask which line is still open.
    blocks:
      - type: paragraph
        text: The release holds if any of these stay open.
      - type: bullets
        items:
          - text: Export YAML, PDF, Word, and PowerPoint
            step: 1
          - text: Keep taken notes on the deck
            step: 2
          - text: Leave the main stage fixed
            step: 3
      - type: callout
        text: A missing owner is an open item.
        step: 3
    side:
      - type: code
        language: yaml
        code: |
          widgets:
            - id: ship-scope
              type: radio
              prompt: Is scope acceptable?
      - type: callout
        text: The side column is reference material. The script stays in the notes band.
    widgets:
      - id: ship-scope
        type: radio
        prompt: Is scope acceptable?
        options:
          - "Yes"
          - Cut
          - Stop
      - id: risks
        type: checkbox
        prompt: Risks still open
        options:
          - Staffing
          - Date
          - Quality
  - id: principle
    layout: quote
    title: Principle
    notes: Pause after the line. Let the room answer.
    blocks:
      - type: quote
        text: A missing decision is a decision to slip.
        attribution: Launch chair
  - id: date
    layout: content
    title: Pick a date
    subtitle: Friday is the default
    notes: Move the date only when someone names the condition.
    theme:
      background: "#1b2430"
      accent: "#8eb6ff"
    blocks:
      - type: paragraph
        text: Move Friday only with a named owner and a written condition.
      - type: image
        alt: Three-step launch sequence
        src: "data:image/png;base64,"
      - type: divider
      - type: paragraph
        text: Record the condition in the decision row before you leave the slide.
    widgets:
      - id: when
        type: select
        prompt: Ship date
        options:
          - Friday
          - Next Monday
          - Undated
      - id: confidence
        type: scale
        prompt: Confidence
      - id: condition
        type: text
        prompt: Condition to proceed
  - id: plan
    layout: content
    title: How Friday gets confirmed
    notes: Point at the table, then use the link if the room goes back to scope.
    blocks:
      - type: numbered
        items:
          - text: Name the owner
          - text: Write the condition
          - text: Confirm Friday
      - type: table
        headers: [Option, Owner]
        rows:
          - [Friday, Launch chair]
          - [Next Monday, Product]
      - type: link
        text: Back to scope
        slide: scope
  - id: evidence
    layout: content
    title: What the room can see
    notes: The chart is the count. Play the walkthrough only if someone asks.
    blocks:
      - type: chart
        kind: column
        labels: [Friday, Monday]
        values: [4, 2]
      - type: video
        title: Launch walkthrough
        src: https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4
  - id: appendix
    hidden: true
    layout: content
    title: Appendix
    notes: Kept out of the talk. Open it from the outline when someone asks.
    blocks:
      - type: paragraph
        text: This slide stays out of the talk and out of exports.
