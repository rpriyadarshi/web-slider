id: incident-review
title: Incident Review
author: Meridian
footer: Incident Review
slides:
  - id: title
    layout: title
    title: Review the outage
    subtitle: What failed, who owns the fix, and when it is done
    notes: Open with the customer impact, not the timeline.
    side:
      - type: callout
        text: Forty minutes. Checkout was down. One owner.
  - id: agenda
    layout: section
    title: Three questions
    subtitle: Impact, cause, and the fix
    notes: Read the three questions, then go to the impact.
  - id: impact
    layout: content
    title: What the customer saw
    notes: Stay on the timeline. The count is the next slide.
    blocks:
      - type: paragraph
        text: Checkout failed for the customers in the chart.
      - type: mermaid
        caption: Forty minutes from first error to recovery
        source: |
          flowchart LR
            E1402[14:02 Errors] --> E1411[14:11 Status page]
            E1411 --> E1441[14:41 Recovered]
  - id: count
    layout: content
    title: Who was hit
    notes: The chart is the count. Do not open the log until someone asks.
    blocks:
      - type: chart
        kind: column
        labels: [Errors, Recovered]
        values: [640, 640]
    widgets:
      - id: severity
        type: select
        prompt: Severity
        options:
          - Sev 1
          - Sev 2
          - Sev 3
  - id: cause
    layout: content
    title: The check that failed
    notes: Point at the sequence. The command is the next slide.
    blocks:
      - type: mermaid
        caption: Where the deploy went green without a check
        source: |
          sequenceDiagram
            participant CI
            participant Pay as Payments
            participant Store
            CI->>Pay: Health check skipped
            CI->>Store: Deploy marked green
            Store-->>Pay: Checkout traffic
            Pay-->>Store: Errors from 14:02
    side:
      - type: link
        text: Back to the impact
        slide: impact
  - id: command
    layout: content
    title: The check that was skipped
    notes: Read the command. A green deploy with a skipped check is still a failed deploy.
    blocks:
      - type: code
        language: bash
        code: |
          curl --fail https://pay.example/health
          echo $?
      - type: callout
        text: A green deploy with a skipped check is still a failed deploy.
  - id: fix
    layout: content
    title: The fix
    notes: Point at the diagram. Do not leave without a date and a name. The walkthrough is the next slide.
    theme:
      background: "#241C18"
      accent: "#E07A3D"
    blocks:
      - type: mermaid
        caption: The fix is done when the check is back and someone owns the date
        source: |
          flowchart LR
            Check[Restore the health check] --> Owner[Name the owner]
            Owner --> Date[Set the date]
    widgets:
      - id: owner
        type: text
        prompt: Owner of the fix
  - id: walkthrough
    layout: content
    title: Checkout walkthrough
    notes: Play this only if someone asks.
    blocks:
      - type: video
        title: Checkout walkthrough
        src: https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4
  - id: principle
    layout: quote
    title: Principle
    notes: Pause after the line.
    blocks:
      - type: quote
        text: A skipped check is a decision to ship blind.
        attribution: Incident chair
  - id: appendix
    hidden: true
    layout: content
    title: Appendix
    notes: Kept out of the review. Open it from the outline for the raw log.
    blocks:
      - type: paragraph
        text: The raw log stays out of the review and out of exports.
