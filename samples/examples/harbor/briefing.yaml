id: harbor-briefing
title: Morning Briefing
author: Harbor
footer: Morning Briefing
slides:
  - id: title
    layout: title
    title: The window is 06:40
    subtitle: Berth, labor, and the one exception
    notes: Open with the tide window. Do not start with yesterday.
    side:
      - type: callout
        text: Twelve minutes. Three calls. One exception.
  - id: agenda
    layout: section
    title: Three calls
    subtitle: Berth, labor, and the exception
    notes: Name the three calls, then go to the berth plan.
  - id: berth
    layout: content
    title: Berth plan
    notes: Point at the diagram. Ask who owns the late vessel before you leave the slide.
    blocks:
      - type: paragraph
        text: Two vessels are inside the window. One is not.
      - type: mermaid
        caption: Three calls on the tide window
        source: |
          flowchart TD
            Window[06:40 window] --> North[North pier grain ship]
            Window --> South[South pier container ship]
            Window --> Tanker[Tanker waits for a named pilot]
      - type: callout
        text: A missing pilot is an open berth.
    side:
      - type: code
        language: yaml
        code: |
          widgets:
            - id: berth-call
              type: radio
              prompt: Is the berth plan set?
    widgets:
      - id: berth-call
        type: radio
        prompt: Is the berth plan set?
        options:
          - Set
          - Hold the tanker
          - Stop
  - id: labor
    layout: content
    title: Labor on the window
    subtitle: Heads counted at 05:30
    notes: The chart is the count. The diagram is the shortfall. Do not add a fourth gang without a name.
    blocks:
      - type: chart
        kind: column
        labels: [North, South, Tanker]
        values: [18, 14, 6]
      - type: mermaid
        caption: South pier is two short of the plan
        source: |
          flowchart LR
            Count[Heads at 05:30] --> South[South pier short two]
            South --> Name[Name the drivers]
      - type: paragraph
        text: South pier is two short of the plan.
    widgets:
      - id: gang
        type: scale
        prompt: Confidence in the labor count
  - id: exceptions
    layout: content
    title: What is still open
    notes: Point at the diagram, then the table. Use the link if the room goes back to the berth.
    theme:
      background: "#E7EEF3"
      accent: "#1B4F72"
    blocks:
      - type: mermaid
        caption: Close the window only with a named owner
        source: |
          flowchart TD
            Open[Open items] --> Pilot[Pilot for the tanker]
            Open --> Drivers[Two crane drivers]
            Pilot --> Confirm[Confirm 06:40]
            Drivers --> Confirm
      - type: table
        headers: [Item, Owner]
        rows:
          - [Pilot for the tanker, Harbor master]
          - [Two crane drivers, Stevedore]
      - type: link
        text: Back to the berth plan
        slide: berth
  - id: principle
    layout: quote
    title: Principle
    notes: Pause after the line.
    blocks:
      - type: quote
        text: A window without an owner is a window you missed.
        attribution: Harbor master
  - id: appendix
    hidden: true
    layout: content
    title: Appendix
    notes: Kept out of the briefing. Open it from the outline when someone asks for the draft.
    blocks:
      - type: paragraph
        text: Draft gang sheets stay out of the briefing and out of exports.
