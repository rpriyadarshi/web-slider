# Package name emporion. A manifest value with no slash loads samples/themes/<name>/manifest.yaml.
# This file declares the brand. Another manifest may set brand to this package name.
# Marks and fonts are paths beside this file.
brand:
  name: Emporion
  wordmark: EMPORION
  tail: AI
  accent: "#3DB892"
  highlight: "#E4B84A"
  mark: mark.svg
  markDark: mark-on-dark.svg
fonts:
  Inter:
    regular: fonts/Inter-Regular.ttf
    semibold: fonts/Inter-SemiBold.ttf
  Source Serif 4:
    regular: fonts/SourceSerif4-Regular.ttf
    semibold: fonts/SourceSerif4-Semibold.ttf
  JetBrains Mono:
    regular: fonts/JetBrainsMono-Regular.ttf
    semibold: fonts/JetBrainsMono-Bold.ttf
aspect: "16:9"
showSlideNumber: true
theme:
  background: "#FAFAFA"
  surface: "#FFFFFF"
  text: "#1F1F1F"
  muted: "#5E5E5E"
  accent: "#3DB892"
  highlight: "#E4B84A"
  chrome: light
  chromeLight:
    ground: "#FAFAFA"
    paper: "#FFFFFF"
    text: "#1F1F1F"
    muted: "#5E5E5E"
    line: "#E0E0E0"
  chromeDark:
    ground: "#121212"
    paper: "#1E1E1E"
    text: "#E8E8E8"
    muted: "#A6A6A6"
    line: "#333333"
  layouts:
    title:
      title: { x: 8, y: 22, w: 84, h: 16 }
      subtitle: { x: 8, y: 40, w: 84, h: 10 }
      author: { x: 8, y: 52, w: 84, h: 8 }
      footer: { x: 6, y: 88, w: 88, h: 8 }
    section:
      title: { x: 8, y: 36, w: 84, h: 16 }
      footer: { x: 6, y: 88, w: 88, h: 8 }
    content:
      title: { x: 6, y: 5, w: 88, h: 14 }
      body: { x: 6, y: 20, w: 88, h: 66 }
      footer: { x: 6, y: 88, w: 88, h: 8 }
    quote:
      body: { x: 10, y: 24, w: 80, h: 52 }
      footer: { x: 6, y: 88, w: 88, h: 8 }
