# Package name meridian. A manifest value with no slash loads samples/themes/meridian/manifest.yaml.
# Built-in faces are named here and stored once under samples/themes/emporion/fonts/.
brand:
  name: Meridian
  wordmark: MERIDIAN
  accent: "#E07A3D"
  highlight: "#E4B84A"
  mark: mark.svg
  markDark: mark-on-dark.svg
fonts:
  Inter:
    regular: ../emporion/fonts/Inter-Regular.ttf
    semibold: ../emporion/fonts/Inter-SemiBold.ttf
  Source Serif 4:
    regular: ../emporion/fonts/SourceSerif4-Regular.ttf
    semibold: ../emporion/fonts/SourceSerif4-Semibold.ttf
  JetBrains Mono:
    regular: ../emporion/fonts/JetBrainsMono-Regular.ttf
    semibold: ../emporion/fonts/JetBrainsMono-Bold.ttf
aspect: "16:9"
showSlideNumber: true
theme:
  background: "#161311"
  surface: "#26211D"
  text: "#F4EFE8"
  muted: "#B3A79C"
  accent: "#E07A3D"
  fontHeading: Source Serif 4
  fontBody: Inter
  fontMono: JetBrains Mono
  align: left
  headingScale: 1.08
  radius: 2
  highlight: "#E4B84A"
  chrome: dark
  layouts:
    title:
      title: { x: 8, y: 22, w: 84, h: 16 }
      subtitle: { x: 8, y: 40, w: 84, h: 10 }
      author: { x: 8, y: 52, w: 84, h: 8 }
      footer: { x: 6, y: 88, w: 88, h: 8 }
    section:
      title: { x: 8, y: 36, w: 84, h: 16 }
      footer: { x: 6, y: 88, w: 88, h: 8 }
    content:
      title: { x: 6, y: 5, w: 88, h: 14 }
      body: { x: 6, y: 20, w: 88, h: 66 }
      footer: { x: 6, y: 88, w: 88, h: 8 }
    quote:
      body: { x: 10, y: 24, w: 80, h: 52 }
      footer: { x: 6, y: 88, w: 88, h: 8 }
